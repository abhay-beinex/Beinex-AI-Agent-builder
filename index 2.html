/* ---------- action router for every wd-* control ---------- */
function handleWatcherAction(a, el) {
  const id = el.dataset.id;
  if (a === 'wd-new') {
    const own = el.dataset.owner;
    const ctx = own === 'workflow' ? { ownerType: 'workflow', workflowId: id } : { ownerType: 'agent', agentId: id };
    if (el.dataset.start === '1' && own === 'workflow') ctx.startsWorkflow = id;
    const d = baseWatcherDraft(ctx);
    if (ctx.startsWorkflow) { d.name = 'Trigger for ' + (WORKFLOWS[id] ? WORKFLOWS[id].name : 'this flow'); d.signal = 'event'; d.cadence = 'On every event'; }
    openWatcherEditor({ draft: d, banner: ctx.startsWorkflow ? 'This watcher will start the workflow when its condition is met. An approver signs it off before it goes live.' : '' });
  }
  else if (a === 'wd-edit') { openWatcherEditor({ id }); }
  else if (a === 'wd-test-saved') { const w = pulseWatcher(id); if (w) openWatcherEditor({ id, test: watcherDryRun(w) }); }
  else if (a === 'wd-test') {
    readWatcherForm();
    S.modalData.test = watcherDryRun(S.modalData.draft);
    S.modalData.error = '';
    render();
  }
  else if (a === 'wd-template') {
    const ag = AGENTS[id];
    const tpl = watcherTemplatesFor(ag)[parseInt(el.dataset.i, 10)];
    if (ag && tpl) openWatcherEditor({ draft: draftFromTemplate(tpl, { ownerType: 'agent', agentId: id }), banner: 'Suggested for ' + ag.spec.name + '. Review it, test it, then save.' });
  }
  else if (a === 'wd-toggle') { toggleWatcher(id); }
  else if (a === 'wd-approve') { approveWatcher(id); }
  else if (a === 'wd-decline') { declineWatcher(id); }
  else if (a === 'wd-delete') {
    const w = pulseWatcher(id);
    if (!w) return;
    S.modal = 'confirm-delete';
    S.modalData = { type: 'watcher', id, title: w.name, typeTitle: 'Watcher' };
    render();
  }
  else if (a === 'wd-open') { openWatcherInBuilder(id); }
  else if (a === 'wd-monitor-flow') { openFlowMonitor(el.dataset.id || S.wf); }
  else if (a === 'wd-fm-test') {
    readFlowMonitorForm();
    const wf = WORKFLOWS[S.modalData.wfId];
    S.modalData.test = watcherDryRun(flowMonitorDraft(wf, S.modalData.params));
    S.modalData.error = '';
    render();
  }
  else if (a === 'wd-fm-stop') {
    const w = flowMonitorOf(S.modalData && S.modalData.wfId);
    if (w) {
      wHist(w, S.user, 'Stopped monitoring the flow');
      PULSE.watchers = PULSE.watchers.filter(x => x.id !== w.id);
      saveWatchers();
    }
    S.modal = null; S.modalData = null;
    render();
    toast('Stopped monitoring this flow');
  }
  else if (a === 'wd-step-test') { stepWatchTest(); }
  else if (a === 'wd-gov-pause') { setGlobalPause(true); }
  else if (a === 'wd-gov-resume') { setGlobalPause(false); }
}

/* =====================================================================
   PROMPT-TO-AGENT / WORKFLOW COMPILER (PRD 4.2 & 7.1)
   ===================================================================== */
const AR_RE = /[\u0600-\u06FF]/;
const KIND_RULES = [
  ['invoice', /invoice|فاتور|purchase order|\bpo\b|أوامر الشراء|أمر الشراء/i],
  ['contract', /contract|clause|عقد|عقود|بند/i],
  ['leave', /\bleave\b|holiday|vacation|إجاز/i],
  ['document', /onboarding|checklist|missing document|document review|submitted document|مستند|وثائق/i],
  ['supplier', /sanction|licen[cs]e|supplier risk|due diligence|supplier|مورد|عقوبات|مخاطر/i],
  ['policy', /policy|policies|handbook|cite the|سياس/i]
];

const TOOL_WORDS = [
  ['outlook-read', /outlook|e-?mail|mailbox|inbox|بريد/i],
  ['sharepoint', /sharepoint/i],
  ['web-search', /web search|search the web|internet|online|sanctions list/i],
  ['sap-read', /\bsap\b|finance system|ledger/i],
  ['hr-read', /hr system|hr data/i],
  ['contracts', /contracts? register/i],
  ['supplier-reg', /supplier register/i]
];

function uniqueName(n, selfId) {
  let name = n, i = 2;
  const taken = x => Object.values(AGENTS).some(a => a.id !== selfId && a.spec && a.spec.name.toLowerCase() === x.toLowerCase());
  while (taken(name)) name = `${n} (${i++})`;
  return name;
}

const initialsOf = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'AG';

function analyze(text) {
  const t = text.toLowerCase();
  let kind = 'generic';
  for (const [k, re] of KIND_RULES) {
    if (re.test(text)) { kind = k; break; }
  }
  const people = Object.values(PEOPLE).filter(p => p.id !== ME && (t.includes(p.name.split(' ')[0].toLowerCase()) || p.ar.some(a => text.includes(a)))).map(p => p.id);
  const fm = text.match(/(?:above|over|more than|greater than|exceeding|exceeds|>)\s*(?:aed\s*)?([\d,]{3,})/i);
  let trigger = 'chat';
  if (/(arrive|incoming|new (invoice|email|file)|inbox|mailbox|receiv)|يصل|وارد/i.test(text)) trigger = 'email';
  if (/(every|each) (day|week|month|monday|morning)|monthly|daily|weekly|schedule/i.test(text)) trigger = 'schedule';
  const extra = TOOL_WORDS.filter(([, re]) => re.test(text)).map(([id]) => id);
  let modelHint = null;
  if (/recommend|decide|score|route|prioriti[sz]e/i.test(text)) modelHint = 'noah-decide';
  else if (/check|verify|validate|compare|extract|flag|match|screen/i.test(text)) modelHint = 'noah-verify';
  else if (/summari[sz]e|draft|write|explain|translate|answer/i.test(text)) modelHint = 'general-llm';

  return {
    text,
    kind,
    approver: people[0] || 'fa',
    floor: fm ? parseInt(fm[1].replace(/,/g, ''), 10) : null,
    trigger,
    writeIntent: /\b(pay|post|release|send (?:an? )?e-?mail|email the|update (?:the )?record|write to|mark .{0,24}paid|delete)\b/i.test(text),
    memory: /remember|memory|ذاكرة/i.test(text),
    extra,
    modelHint,
    ar: AR_RE.test(text)
  };
}

function buildSpec(an, answers = {}, selfId) {
  const kind = an.kind, K = KINDS[kind] || KINDS.generic, approver = answers.approver || an.approver || 'fa';
  const spec = mkSpec(kind, { approver });
  if (kind === 'generic') {
    spec.name = 'Custom Agent Assistant';
    spec.ini = 'CA';
    spec.role = an.text;
  }
  spec.name = uniqueName(spec.name, selfId);
  if (an.modelHint) {
    spec.model = an.modelHint;
    spec.why.model = `Selected ${an.modelHint} based on your task description.`;
  }
  an.extra.forEach(id => { if (!spec.tools.includes(id)) spec.tools.push(id); });
  if (spec.tools.includes('web-search') && !spec.rules.some(r => /cite/i.test(r.text))) {
    spec.rules.push({ id: uid('r'), text: 'Cite every web source with official URL citations.' });
  }
  if (an.floor) {
    spec.rules.push({ id: uid('r'), text: `Only look at items above AED ${fmt(an.floor)}.`, floor: an.floor });
  }
  spec.trigger = { type: an.trigger, detail: TRIGGERS[an.trigger].detail };
  spec.memory.on = !!an.memory;
  spec.lang = an.ar ? 'ar' : 'en';
  return spec;
}

const BT = {};
const say = (a, m) => { (BT[a.id] = BT[a.id] || []).push(Object.assign({ t: now() }, m)); };

function refine(a, text) {
  const s = a.spec, t = text.toLowerCase().trim(), changed = [];
  let reply = '', opts = null;

  if (/never write|suggest only|level 1/i.test(t)) {
    s.autonomy = 1; changed.push('autonomy');
    reply = 'Autonomy set to **Level 1: Suggest drafts only**. A human performs every final action.';
    return { changed, reply };
  }
  if (/noah-decide/i.test(t)) {
    s.model = 'noah-decide'; changed.push('model');
    reply = 'Model switched to **noah-decide** (tuned for recommendations and scoring).';
    return { changed, reply };
  }
  if (/noah-verify/i.test(t)) {
    s.model = 'noah-verify'; changed.push('model');
    reply = 'Model switched to **noah-verify** (tuned for checking and extraction).';
    return { changed, reply };
  }
  if (/memory/i.test(t)) {
    s.memory.on = !s.memory.on; changed.push('memory');
    reply = `Persistent memory is now **${s.memory.on ? 'Enabled' : 'Disabled'}**.`;
    return { changed, reply };
  }
  const m = t.match(/(?:above|over|exceeding)\s*(?:aed\s*)?([\d,]{2,})/);
  if (m) {
    const v = parseInt(m[1].replace(/,/g, ''), 10);
    s.rules.push({ id: uid('r'), text: `Only look at items above AED ${fmt(v)}.`, floor: v });
    changed.push('rules');
    reply = `Added threshold rule: **Only process items above AED ${fmt(v)}**.`;
    return { changed, reply };
  }
  if (/web|search/i.test(t) && !s.tools.includes('web-search')) {
    s.tools.push('web-search'); changed.push('tools');
    reply = 'Added tool: **Web search (Trusted official sites)** with citations.';
    return { changed, reply };
  }

  // Generic addition
  s.rules.push({ id: uid('r'), text: text.charAt(0).toUpperCase() + text.slice(1) });
  changed.push('rules');
  reply = `Added rule: “${text}”`;
  return { changed, reply };
}

function renderChatBubble(m, activeChatKey) {
  if (m.who === 'sys') return `<div class="sysline"><span>${esc(m.text)}</span></div>`;
  if (m.who === 'you') {
    const curU = PEOPLE[S.user] || PEOPLE.mk;
    return `<div class="msg me"><div class="meta">${esc(curU.name)} · ${m.t || now()}</div><div class="bub">${rich(m.text)}</div></div>`;
  }
  if (m.html) return `<div class="msg"><div class="body" style="max-width:100%"><div class="meta"><b>Multi-Agent Deliberation Report</b> · ${m.t || now()}</div>${m.html}</div></div>`;

  const isCouncilMsg = m.who === 'council';
  let senderName = 'Ephrem Assistant';
  let senderIni = 'EA';
  let senderStatus = 'live';

  if (isCouncilMsg) {
    const rawId = activeChatKey && activeChatKey.includes(':') ? activeChatKey.split(':')[1] : activeChatKey;
    const c = COUNCILS[rawId] || COUNCILS.proc;
    senderName = c ? c.name : 'Deliberative Council';
    senderIni = 'CC';
    senderStatus = 'accent';
  } else if (AGENTS[m.who] && AGENTS[m.who].spec) {
    senderName = AGENTS[m.who].spec.name;
    senderIni = AGENTS[m.who].spec.ini || m.who.toUpperCase();
    senderStatus = AGENTS[m.who].status || 'live';
  }

  let samplesHtml = '';
  if (Array.isArray(m.samples) && m.samples.length > 0) {
    samplesHtml = `
      <div class="opts" style="margin-top:8px">
        ${m.samples.map(q => `<button type="button" class="opt" data-a="sample-q" data-q="${esc(q)}">${esc(q)}</button>`).join('')}

  }

  return `

      <div class="body">
        <div class="meta"><b>${esc(senderName)}</b> · ${m.t || now()}</div>

}

function getAgentTestCases(agent) {
  if (!agent || !agent.spec) return [];
  if (!Array.isArray(agent.generatedTests) || !agent.generatedTests.length) {
    const tpls = AGENT_TEST_TEMPLATES[agent.spec.kind] || AGENT_TEST_TEMPLATES.generic;
    agent.generatedTests = tpls.map(t => Object.assign({}, t, { status: (agent.tests || 0) > 0 ? 'passed' : 'ready' }));
  }
  return agent.generatedTests;
}

function renderCanvasNode(node, i, wf) {
  const isSelected = S.wfSelNode === node.id;
  const isRunning = S.simulating && S.simStep === (i + 1);
  const badge = getNodeBadge(node);

  if (node.type === 'conditional') {
    return `
      ${i > 0 ? `<div class="conn" data-insert-idx="${i}"><button data-a="add-step-at" data-idx="${i}" title="Insert step here">+</button></div>` : ''}
      <div class="fork">
        <div class="node ${isSelected ? 'sel' : ''} ${isRunning ? 'active-running' : ''}" data-a="select-canvas-node" data-id="${node.id}">
          <div class="node-h">
            <div class="av sm accent round">?</div>
            <div class="t">
              <b>${esc(node.title)}</b>
              <div class="k">THRESHOLD FORK · GOLDEN RULE (PRD 5.2)</div>
            </div>
            <span class="tag wait">Logic Gate</span>
            <button type="button" class="node-del-btn" data-a="delete-canvas-node" data-id="${node.id}" title="Delete step" onclick="deleteCanvasNode('${node.id}'); event.stopPropagation();">${IC.x}</button>
          </div>
        </div>
        <svg viewBox="0 0 540 42" fill="none">
          <path d="M270 0v14M270 14H135v28M270 14h135v28" stroke="var(--line2)" stroke-width="2"/>
        </svg>
        <div class="br">
          <div class="branch ${S.simulating && S.simStep >= 4 ? 'hit' : ''}" id="branch-approval">
            <span class="pill wait"><i></i>If Mismatch / > AED 50k</span>
            <span class="xs muted">Routes to Fatima Al Mansoori sign-off</span>
          </div>
          <div class="branch">
            <span class="pill live"><i></i>Within Normal Limits</span>
            <span class="xs muted">Auto-route under admin rules</span>
          </div>
        </div>
      </div>
    `;
  }

  return `
    ${i > 0 ? `<div class="conn" data-insert-idx="${i}"><button data-a="add-step-at" data-idx="${i}" title="Insert step here">+</button></div>` : ''}
    <div class="node ${isSelected ? 'sel' : ''} ${isRunning ? 'active-running' : ''}" data-a="select-canvas-node" data-id="${node.id}">
      <div class="node-h">
        <div class="av sm ${node.type}">${badge.ini}</div>
        <div class="t">
          <b>${esc(node.title)}</b>
          <div class="k">${node.type.toUpperCase()} · ${esc((node.desc || '').slice(0, 48))}...</div>
        </div>
        ${badge.tag}
        ${nodeWatchTags(node, wf, i)}
        <button type="button" class="node-del-btn" data-a="delete-canvas-node" data-id="${node.id}" title="Delete step" onclick="deleteCanvasNode('${node.id}'); event.stopPropagation();">${IC.x}</button>
      </div>
    </div>
  `;
}

function triggerSimulation() {
  S.simulating = true;
  S.simStep = 1;
  render();
  toast('Workflow Simulation Started: Ingesting sample invoice INV-2291...');

  setTimeout(() => {
    if (!S.simulating) return;
    S.simStep = 2; render();
    toast('noah-verify: Extraction complete. PO mismatch detected (+5 units)...');

    setTimeout(() => {
      if (!S.simulating) return;
      S.simStep = 3; render();
      toast('Threshold Rule: AED 84,200 > AED 50,000 threshold. Routing to Fatima...');

      setTimeout(() => {
        if (!S.simulating) return;
        S.simStep = 4;
        S.modal = 'approval';
        render();
      }, 1500);
    }, 1500);
  }, 1500);
}

/* =====================================================================

document.addEventListener('click', e => {

    S.modal = null;
    render();
    return;
  }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;

  if (a === 'view') { S.view = el.dataset.v; render(); }
  else if (a === 'open-user-switcher') {
    S.modal = 'user-switcher';
    render();
  }
  else if (a === 'switch-user') {
    const uid = el.dataset.u;
    if (PEOPLE[uid]) {
      S.user = uid;
      S.modal = null;
      render();
      toast('Logged in as ' + PEOPLE[uid].name + ' (' + PEOPLE[uid].badge + ')');
    }
  }
  else if (a === 'open-approval-modal') {
    const runNum = parseInt(el.dataset.run, 10) || 215;
    S.modal = 'approval';
    S.modalData = { run: runNum };
    render();
  }
  else if (a === 'switch-to-fatima-and-open') {
    S.user = 'fa';
    const runNum = parseInt(el.dataset.run, 10) || 215;
    S.modal = 'approval';
    S.modalData = { run: runNum };
    render();
    toast('Switched login to Fatima Al Mansoori (Director of Finance)');
  }
  else if (a === 'fatima-approve-agent') {
    const aid = el.dataset.id;
    const ag = AGENTS[aid];
    if (ag) {
      ag.status = 'live';
      ag.reviewed = true;
      ag.version = (ag.version || 1) + 1;
      ag.versions.unshift({
        v: ag.version,
        at: 'Today ' + now(),
        by: 'Fatima Al Mansoori',
        note: 'Approved for production by Fatima Al Mansoori (Director of Finance)'
      });
      render();
      toast('Agent "' + ag.spec.name + '" approved and promoted to Live by Fatima Al Mansoori!');
    }
  }
  else if (a === 'edit-agent-btn') {
    S.view = 'agent';
    S.ab.agentId = el.dataset.id;
    render();
    toast('Opened Agent Studio to edit ' + ((AGENTS[el.dataset.id] || {}).spec || {}).name);
  }
  else if (a === 'delete-agent-btn') {
    const aid = el.dataset.id;
    const ag = AGENTS[aid];
    if (!ag) return;
    S.modal = 'confirm-delete';
    S.modalData = { type: 'agent', id: aid, title: (ag.spec ? ag.spec.name : aid), typeTitle: 'Agent' };
    render();
  }
  else if (a === 'edit-council-modal') {
    S.modal = 'edit-council';
    S.modalData = el.dataset.id;
    S.councilTab = 'config';
    render();
  }
  else if (a === 'open-council-versions') {
    S.modal = 'edit-council';
    S.modalData = el.dataset.id;
    S.councilTab = 'versions';
    render();
  }
  else if (a === 'open-council-in-studio') {
    S.view = 'agent';
    S.ab.entityType = 'council';
    S.ab.councilId = el.dataset.id;
    render();
    toast('Opened Council in Studio');
  }
  else if (a === 'switch-council-tab') {
    S.councilTab = el.dataset.t;
    render();
  }
  else if (a === 'restore-council-version') {
    const cid = el.dataset.cid;
    const vNum = parseInt(el.dataset.v, 10);
    const c = COUNCILS[cid];
    if (!c || !c.versions) return;
    const ver = c.versions.find(x => x.v === vNum);
    if (!ver || !ver.config) return;

    c.name = ver.config.name;
    c.goal = ver.config.goal;
    c.members = [...ver.config.members];
    c.strategy = ver.config.strategy || 'consensus';
    c.approver = ver.config.approver || 'fa';
    c.version = ver.v;

    render();
    toast(`Rolled back council "${c.name}" to Version ${ver.v}!`);
  }
  else if (a === 'restore-agent-version') {
    const aid = el.dataset.aid;
    const vNum = parseInt(el.dataset.v, 10);
    const ag = AGENTS[aid];
    if (!ag || !ag.versions) return;
    const ver = ag.versions.find(x => x.v === vNum);
    if (!ver) return;
    if (ver.spec) ag.spec = clone(ver.spec);
    ag.version = ver.v;

    render();
    toast(`Rolled back agent "${ag.spec.name}" to Version ${ver.v}!`);
  }
  else if (a === 'save-council-studio') {
    const cid = el.dataset.id;
    const c = COUNCILS[cid];
    if (!c) return;
    const nameIn = $('#c-studio-name');
    const goalIn = $('#c-studio-goal');
    const stratIn = $('#c-studio-strat');
    const apprIn = $('#c-studio-appr');
    const checked = $$('input[name="c-studio-agents"]:checked').map(cb => cb.value);

    if (checked.length < 2) {
      alert('Please select at least 2 member agents for the Council.');
      return;
    }

    const newName = nameIn ? nameIn.value.trim() : c.name;
    const newGoal = goalIn ? goalIn.value.trim() : c.goal;
    const newStrat = stratIn ? stratIn.value : c.strategy;
    const newAppr = apprIn ? apprIn.value : c.approver;

    const changed = newName !== c.name || newGoal !== c.goal || newStrat !== c.strategy || newAppr !== c.approver || checked.join(',') !== c.members.join(',');

    c.name = newName;
    c.goal = newGoal;
    c.strategy = newStrat;
    c.approver = newAppr;
    c.members = checked;

    if (!c.versions) c.versions = [];
    if (changed) {
      const nextV = (c.version || 1) + 1;
      c.version = nextV;
      c.versions.unshift({
        v: nextV,
        at: today(),
        by: PEOPLE[c.approver] ? PEOPLE[c.approver].name : 'Fatima Al Mansoori',
        note: `Updated mandate, agents (${checked.length} members), or strategy in Council Studio`,
        config: {
          name: c.name,
          goal: c.goal,
          members: [...c.members],
          strategy: c.strategy,
          approver: c.approver
        }
      });
    }

    render();
    toast(`Saved changes to council "${c.name}" (Version ${c.version || 1})`);
  }
  else if (a === 'delete-council-btn') {
    const cid = el.dataset.id;
    const c = COUNCILS[cid];
    if (!c) return;
    S.modal = 'confirm-delete';
    S.modalData = { type: 'council', id: cid, title: c.name, typeTitle: 'Council' };
    render();
  }
  else if (a === 'new-wf-btn') {
    S.modal = 'new-wf';
    render();
  }
  else if (a === 'open-edit-wf-modal') {
    S.modal = 'edit-wf';
    S.modalData = el.dataset.id;
    render();
  }
  else if (a === 'delete-wf-btn') {
    const wfid = el.dataset.id;
    const wf = WORKFLOWS[wfid];
    if (!wf) return;
    S.modal = 'confirm-delete';
    S.modalData = { type: 'workflow', id: wfid, title: wf.name, typeTitle: 'Workflow' };
    render();
  }
  else if (a === 'delete-canvas-node') {
    deleteCanvasNode(el.dataset.id);
  }
  else if (a === 'add-brick') {
    const pal = el.dataset.pal;
    const title = el.dataset.title;
    addBrickToWorkflow(pal, title);
  }
  else if (a === 'add-step-at') {
    const idx = parseInt(el.dataset.idx, 10);
    addBrickToWorkflow('agent', 'AI Agent Task', idx);
  }
  else if (a === 'confirm-delete-action') {
    const data = S.modalData;
    if (!data) { S.modal = null; render(); return; }
    if (data.type === 'agent') {
      delete AGENTS[data.id];
      delete CH['agent:' + data.id];
      const remainingAgents = Object.keys(AGENTS);
      if (remainingAgents.length === 0) {
        const fallbackId = uid('ag');
        AGENTS[fallbackId] = mkAgent(fallbackId, mkSpec('generic', { name: 'New Custom Agent', ini: 'NA' }));
        remainingAgents.push(fallbackId);
      }
      if (S.chat === 'agent:' + data.id) S.chat = 'agent:' + remainingAgents[0];
      if (S.ab.agentId === data.id) S.ab.agentId = remainingAgents[0];
      toast('Deleted agent "' + data.title + '"');
    } else if (data.type === 'watcher') {
      const w = pulseWatcher(data.id);
      if (w) {
        logActivity(S.user, (PEOPLE[S.user] ? PEOPLE[S.user].name : 'A user') + ' deleted watcher “' + w.name + '” (' + watcherOwnerLabel(w) + ')', 'Watcher');
        PULSE.watchers = PULSE.watchers.filter(x => x.id !== w.id);
        saveWatchers();
      }
      toast('Deleted watcher “' + data.title + '”');
    } else if (data.type === 'council') {
      delete COUNCILS[data.id];
      delete CH['council:' + data.id];
      const remainingCouncils = Object.keys(COUNCILS);
      if (S.chat === 'council:' + data.id) {
        S.chat = remainingCouncils.length > 0 ? ('council:' + remainingCouncils[0]) : ('agent:' + Object.keys(AGENTS)[0]);
      }
      toast('Deleted council "' + data.title + '"');
    } else if (data.type === 'workflow') {
      delete WORKFLOWS[data.id];
      PULSE.watchers = PULSE.watchers.filter(w => w.workflowId !== data.id);
      PULSE.watchers.forEach(w => { if (w.startsWorkflow === data.id) { w.startsWorkflow = null; if (w.pending) { if (w.pending.isNew) w.enabled = true; w.pending = null; } wHist(w, S.user, 'No longer starts “' + data.title + '” because that workflow was deleted'); } });
      saveWatchers();
      const remainingWfs = Object.keys(WORKFLOWS);
      if (remainingWfs.length === 0) {
        WORKFLOWS.custom = {
          id: 'custom',
          name: 'Custom Governed Workflow',
          status: 'draft',
          version: 1,
          autonomy: 2,
          approver: 'Fatima Al Mansoori',
          trigger: 'When asked in chat',
          nodes: [N('trigger', 'Start trigger'), N('notify', 'Complete')]
        };
        remainingWfs.push('custom');
      }
      if (S.wf === data.id) S.wf = remainingWfs[0];
      saveWorkflows();
      toast('Deleted workflow "' + data.title + '"');
    } else if (data.type === 'node') {
      const targetWfId = data.wfId || S.wf;
      const wf = WORKFLOWS[targetWfId];
      if (wf && wf.nodes) {
        const idx = wf.nodes.findIndex(n => n.id === data.id);
        if (idx !== -1) {
          wf.nodes.splice(idx, 1);
          PULSE.watchers = PULSE.watchers.filter(w => !(w.kind === 'step-watch' && w.workflowId === wf.id && w.stepId === data.id));
          saveWatchers();
          if (wf.nodes.length > 0) {
            const nextIdx = Math.min(idx, wf.nodes.length - 1);
            S.wfSelNode = wf.nodes[nextIdx].id;
          } else {
            S.wfSelNode = null;
          }
          saveWorkflows();
          toast('Deleted step "' + data.title + '" from workflow');
        }
      }
    }
    S.modal = null;
    S.modalData = null;
    render();

      toast('Council synthesized recommendation ready');

  else if (a === 'use-council-in-workflow') {
    const rawId = el.dataset.id || (S.chat.includes(':') ? S.chat.split(':')[1] : S.chat);
    const c = COUNCILS[rawId] || COUNCILS.proc;

  if (a === 'submit-pulse-goal') {
    const inp = $('#pulse-goal-in');
    const val = inp ? inp.value.trim() : '';

    inp.value = '';

    const wid = res.ok && res.w ? res.w.id : 'w-inbox';
    PULSE.goals.unshift({
      id: 'gl-' + Date.now().toString(36),
      text: val,
      agentId: d.agentId || 'ic',
      watcherId: wid,
      status: 'active',
      createdBy: S.user,
      at: 'Today ' + now()
    });
    logActivity(S.user, 'Assigned ongoing goal: "' + val + '" (tracked by ' + d.name + ')', 'Ongoing Goal');
    render();
    toast('Ongoing goal assigned and linked to watcher "' + d.name + '".');

    thread.push({ who: 'you', text: val, t: now() });

      const resp = generateAgentResponse(S.chat, val);

        thread.push({ who: 'council', t: now(), html: resp.html });

        const info = getChatInfo(S.chat);
        thread.push({
          who: info.isCouncil ? 'council' : info.id,

        who: 'council',

      toast('Created new workflow "' + name + '"');
    }
    S.modal = null;
    render();
  }
  else if (a === 'send-agent-prompt') {
    const inp = $('#agent-prompt-in');
    const val = inp ? inp.value.trim() : '';
    if (!val) return;
    inp.value = '';

    const ag = AGENTS[S.ab.agentId] || AGENTS.so;
    say(ag, { who: 'you', text: val });
    const r = refine(ag, val);
    render();

    setTimeout(() => {
      say(ag, { who: 'e', text: r.reply });
      render();
    }, 500);
  }
  else if (a === 'submit-watcher-form') {
    readWatcherForm();
    const md = S.modalData;
    if (!md || !md.draft) return;
    const res = saveWatcherDraft(md.draft, md.id, S.user);
    if (!res.ok) { md.error = res.msg; render(); return; }
    if (md.test) res.w.lastTest = { n: md.test.n, useful: md.test.useful };
    saveWatchers();
    S.modal = null;
    S.modalData = null;
    S.flashW = res.w.id;
    render();
    toast(res.msg);
    setTimeout(() => { const el = document.querySelector('[data-wrow="' + res.w.id + '"]'); if (el) el.classList.remove('hl'); if (S.flashW === res.w.id) S.flashW = null; }, 2600);
  }
  else if (a === 'submit-flow-monitor') { saveFlowMonitor(); }
  else if (a === 'submit-watcher-chat') {
    const inp = form.querySelector('input');
    const val = inp ? inp.value.trim() : '';
    if (!val) return;
    inp.value = '';
    watcherAssist(val, form.dataset.owner === 'workflow' ? { ownerType: 'workflow', workflowId: form.dataset.id } : { ownerType: 'agent', agentId: form.dataset.id });
  }
  else if (a === 'send-say-copilot') {
    const inp = $('#say-input');
    const val = inp ? inp.value.trim() : '';
    if (!val) return;
    inp.value = '';

    S.wfSay.push({ who: 'you', text: val });

    if (/\b(watch|watcher|monitor|whenever|every time|alert me|notify me when)\b/i.test(val) && WORKFLOWS[S.wf]) {
      watcherAssist(val, { ownerType: 'workflow', workflowId: S.wf }, d => {
        S.wfSay.push({ who: 'e', text: 'I drafted “' + d.name + '”' + (d.startsWorkflow ? ' and connected it as this workflow’s trigger' : '') + '. Review it, test it on the last 30 days, then save. Nothing goes live until you do' + (d.startsWorkflow ? ', and an approver signs off' : '') + '.' });
      });
      return;
    }
    render();

    setTimeout(() => {
      if (/council/i.test(val)) {
        S.wfSay.push({ who: 'e', text: 'Added Procurement Council deliberation node before Finance Posting. Council advises; human decision stands.' });
      } else if (/reject|stop/i.test(val)) {
        S.wfSay.push({ who: 'e', text: 'Added Stop node on Fatima rejection branch. Supplier notification drafted.' });
      } else {
        S.wfSay.push({ who: 'e', text: `Applied change: "${val}". Workflow DAG definition synced.` });
      }
      render();
      toast('Workflow canvas updated');
    }, 600);
  }
});

// Drag and Drop for Seven Core Bricks (PRD Section 5 & 7.1)
document.addEventListener('dragstart', e => {
  const pal = e.target.closest('.pal-b');
  if (pal) {
    const brickType = pal.dataset.pal;
    const brickTitle = pal.dataset.title || '';
    e.dataTransfer.setData('text/plain', JSON.stringify({ brickType, brickTitle }));
    e.dataTransfer.effectAllowed = 'copy';
    pal.classList.add('dragging');
    const canvas = $('#canvas-area');
    if (canvas) canvas.classList.add('drag-active');
  }
});

document.addEventListener('dragend', e => {
  const pal = e.target.closest('.pal-b');
  if (pal) pal.classList.remove('dragging');
  const canvas = $('#canvas-area');
  if (canvas) {
    canvas.classList.remove('drag-active');
    canvas.querySelectorAll('.drag-target-over').forEach(el => el.classList.remove('drag-target-over'));
  }
});

document.addEventListener('dragover', e => {
  const canvasArea = e.target.closest('#canvas-area');
  const wfItem = e.target.closest('[data-a="select-wf"]');

  if (canvasArea || wfItem) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';

    if (canvasArea) {
      const dropzone = e.target.closest('[data-insert-idx]');
      canvasArea.querySelectorAll('.drag-target-over').forEach(el => {
        if (el !== dropzone) el.classList.remove('drag-target-over');
      });
      if (dropzone) {
        dropzone.classList.add('drag-target-over');
      }
    } else if (wfItem) {
      document.querySelectorAll('[data-a="select-wf"]').forEach(el => {
        if (el !== wfItem) el.classList.remove('drag-target-over');
      });
      wfItem.classList.add('drag-target-over');
    }
  }
});

document.addEventListener('dragleave', e => {
  const dropzone = e.target.closest('[data-insert-idx]');
  if (dropzone && (!e.relatedTarget || !dropzone.contains(e.relatedTarget))) {
    dropzone.classList.remove('drag-target-over');
  }
  const wfItem = e.target.closest('[data-a="select-wf"]');
  if (wfItem && (!e.relatedTarget || !wfItem.contains(e.relatedTarget))) {
    wfItem.classList.remove('drag-target-over');
  }
});

document.addEventListener('drop', e => {
  const canvasArea = e.target.closest('#canvas-area');
  const wfItem = e.target.closest('[data-a="select-wf"]');

  if (!canvasArea && !wfItem) return;
  e.preventDefault();

  if (canvasArea) {
    if (canvasArea.classList) canvasArea.classList.remove('drag-active');
    if (canvasArea.querySelectorAll) canvasArea.querySelectorAll('.drag-target-over').forEach(el => el.classList.remove('drag-target-over'));
  }
  if (wfItem) {
    if (wfItem.classList) wfItem.classList.remove('drag-target-over');
  }

  let brickType = null;
  let brickTitle = null;

  try {
    const raw = e.dataTransfer.getData('text/plain');
    if (raw && raw.startsWith('{')) {
      const data = JSON.parse(raw);
      brickType = data.brickType;
      brickTitle = data.brickTitle;
    } else {
      brickType = raw;
    }
  } catch (err) {
    brickType = e.dataTransfer.getData('text/plain');
  }

  if (!brickType) return;

  if (wfItem) {
    const targetWfId = wfItem.dataset.id;
    if (targetWfId && WORKFLOWS[targetWfId]) {
      S.wf = targetWfId;
      addBrickToWorkflow(brickType, brickTitle);
      return;
    }
  }

  const dropzone = e.target.closest('[data-insert-idx]');
  let insertIdx = undefined;
  if (dropzone && dropzone.dataset.insertIdx !== undefined) {
    insertIdx = parseInt(dropzone.dataset.insertIdx, 10);
  }

  addBrickToWorkflow(brickType, brickTitle, insertIdx);
});

// Initial boot
render();
console.log('Beinex AI Agent Workflow Builder (Ephrem) initialized with strict viewport containment.');
</script>
