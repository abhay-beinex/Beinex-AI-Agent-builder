<script>

function cardHtml(n){
  return `<div class="card"><div class="r"><div>Name</div><div>${esc(n.name)}</div></div><div class="r"><div>What it does</div><div>${esc(n.does)}</div></div>

function startNewAgent(text){
  S.newStage='chat'; S.newThread=[{who:'you',text,t:now()}];
  const fin=/invoice/i.test(text), doc=/document|checklist/i.test(text);
  S.newAgent={name:fin?'Invoice Checker':doc?'Document Review':'Staff Questions',status:'draft',sub:'Draft · only you can see this',line:'Draft · describing',
    does:fin?'Compares each new supplier invoice with its purchase order and flags mismatches in amount, quantity or supplier.':doc?'Checks each submitted document against the onboarding checklist and lists what is missing.':'Answers staff questions from the policy library and cites the section.',
    uses:fin?['Finance system (read only)','Supplier invoices mailbox (read only)']:doc?['Document inbox (read only)','Onboarding checklist']:['Policy library (read only)'],
    runs:fin?'When a new invoice arrives':doc?'When a document is submitted':'When asked in chat',
    tier:fin?'2 · needs approval':'1 · goes live on your confirmation',approver:fin?'Fatima Al Mansoori':'none needed',rules:[],hasCard:false};
  S.typing=true; render();
  setTimeout(()=>{S.typing=false;S.newAgent.hasCard=true;S.newThread.push({who:'e',t:now(),text:'Got it. Here’s what I’ll set up. Check it and change anything that’s off.',html:cardHtml(S.newAgent)});render()},1100);
}
function replyNew(text){
  const n=S.newAgent; S.newThread.push({who:'you',text,t:now()}); S.typing=true; render();
  setTimeout(()=>{S.typing=false;
    if(/paid|mark|write|update|post|change the (finance|hr)/i.test(text)){
      S.newThread.push({who:'e',t:now(),text:'That part needs the agent to <b>write</b> to the Finance system, and only IT can grant that. Everything else is ready. I can send IT a request with your words attached, and the agent can go ahead without that step in the meantime.',html:`<div class="acts"><button class="btn" data-a="askit" data-q="${esc(text)}">Send the request to IT</button><button class="btn" data-a="toast" data-t="OK. The agent stays as it is.">Skip that, continue</button></div>`});
    } else if(/over|above|more than|\d/.test(text)){
      const m=text.match(/(aed\s*)?([\d,]+)/i); const amt=m?'AED '+m[2]:'AED 50,000';
      n.rules.push(['Send to a person if the amount is over',amt]); n.tier='2 · needs approval'; n.approver='Fatima Al Mansoori';
      S.newThread.push({who:'e',t:now(),text:`Added. Anything over <b>${amt}</b> will go to a person instead of being flagged automatically. I’ve suggested <b>Fatima Al Mansoori</b>, since she already approves for Finance.`,html:cardHtml(n)});
    } else {
      n.does=n.does+' '+text.replace(/^(also|and)\s*/i,'').replace(/^\w/,c=>c.toUpperCase()).replace(/\.?$/,'.');
      S.newThread.push({who:'e',t:now(),text:'Added to the card.',html:cardHtml(n)});
    }
    render()},1000);
}
function sendForApproval(){
  const n=S.newAgent;
  if(n.tier.startsWith('1')){n.status='live';n.sub='Live · on your confirmation';n.line='Live';S.newThread.push({who:'status',icon:ico.check,text:'Live · your confirmation at '+now()+' is logged as the attestation'});render();return}
  n.status='wait'; n.sub='Awaiting approval · with Fatima Al Mansoori'; n.line='Awaiting approval';
  S.newThread.push({who:'status',icon:ico.clock,text:'Sent for approval to Fatima Al Mansoori · '+now()+' · she sees the same card you confirmed'});
  render();
  setTimeout(()=>{S.newThread.push({who:'fa',t:now(),text:'Does this include credit notes? We had trouble with those last year.'});n.awaiting='fa';S.unread++;render()},2600);
}

function dz(path,i){return `<div class="drop ${S.dragging?'live':''}" data-drop="${path}" data-i="${i}">${S.dragging?'Drop here':''}</div>`}
function renderBricks(list,path){
  let out=''; list.forEach((b,i)=>{ if(!(path==='root'&&i===0)) out+=dz(path,i); out+=brick(b,path,i); });
  out+=dz(path,list.length); return out;
}
function tabOf(b){return `<div class="tab" style="background:${({trigger:'var(--trig)',agent:'var(--agent)',council:'var(--council)',person:'var(--person)',stop:'var(--bad-soft)',wait:'var(--trig)',tell:'var(--person)'})[b.type]||'var(--shape)'}"></div>`}
function brick(b,path,i){
  const x=`<button class="x" data-a="del" data-id="${b.id}" aria-label="Remove">×</button>`;
  const drag=`draggable="true" data-move="${b.id}"`;

  if(b.type==='if') return `<div class="ifb ${b.fresh?'new':''}" ${drag}><div class="hd"><b>If</b> <span class="chip" contenteditable="true" data-chip="${b.id}" data-k="a">${esc(b.a)}</span><span>or the amount is over</span><span class="chip" contenteditable="true" data-chip="${b.id}" data-k="b">${esc(b.b)}</span>${x}</div><div class="slot">${renderBricks(b.slot,b.id)}</div><div class="ft"><b>Otherwise</b> carry on</div></div><div class="tab" style="background:var(--shape)"></div>`;

  const lead=b.type==='council'?ico.ppl:b.type==='stop'||b.type==='wait'?'':`<span class="av sm" style="${b.type==='person'||b.type==='tell'?'background:var(--person-av);color:#1F2A37':'background:var(--agent-ink);color:var(--agent)'}">${ini}</span>`;
  const txt=b.type==='council'?`Ask the <b>${esc(b.label)}</b>${b.does?': '+esc(b.does):''}`:b.type==='stop'?'<b>Stop</b> here':b.type==='wait'?`<b>Wait for</b> <span class="chip" contenteditable="true" data-chip="${b.id}" data-k="label">${esc(b.label)}</span>`:`<b>${esc(b.label)}</b> ${esc(b.does||'')}`;
  return `<div class="brick b-${b.type} ${b.fresh?'new':''}" ${drag}>${lead}<div style="flex:1;min-width:0">${txt}</div><span class="kind">${b.type==='tell'?'person':b.type}${b.fresh?' · just added':''}</span>${x}</div>${tabOf(b)}`;
}
function findList(w,path){ if(path==='root') return w.bricks; const f=(l)=>{for(const b of l){if(b.id===path)return b.slot;if(b.slot){const r=f(b.slot);if(r)return r}}}; return f(w.bricks)||w.bricks }
function removeBrick(w,id){const f=(l)=>{const i=l.findIndex(b=>b.id===id);if(i>=0)return l.splice(i,1)[0];for(const b of l){if(b.slot){const r=f(b.slot);if(r)return r}}};return f(w.bricks)}
function newBrickFromPal(type,label){
  if(type==='agent') return mk('agent',label,{ini:label.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),does:({'Invoice Checker':'compares it with the purchase order','Finance Posting':'posts the approved invoice','Contract Review':'checks the contract','Supplier Onboarding':'checks the documents'})[label]||'',fresh:true});
  if(type==='council') return mk('council',label,{does:'advises, a person decides',fresh:true});
  if(type==='person') return label.startsWith('Tell')?mk('tell','Tell me',{ini:'MK',does:'in my Chats',fresh:true}):mk('person','Fatima',{ini:'FA',does:'decides',fresh:true});
  if(type==='trigger') return mk('trigger',({'Something arrives':'something arrives','On a schedule':'every Monday, 09:00','Someone asks in chat':'someone asks in chat'})[label],{fresh:true});
  if(type==='if') return mk('if','',{a:'something is wrong',b:'AED 50,000',slot:[],fresh:true});
  if(type==='wait') return mk('wait','2 working days',{fresh:true});
  return mk('stop','Stop',{fresh:true});
}
function clearFresh(w){const f=l=>l.forEach(b=>{delete b.fresh;if(b.slot)f(b.slot)});f(w.bricks)}
function placeBrick(w,b,path,i){

  if(path==='root'&&i===0&&w.bricks[0]&&w.bricks[0].type==='trigger') i=1;
  const list=findList(w,path);
  if(b.label==='Finance Posting'){ const before=w.bricks.slice(0,path==='root'?i:w.bricks.findIndex(x=>x.id===path)+1); const hasPerson=before.some(x=>x.type==='person'||(x.slot&&x.slot.some(y=>y.type==='person'))); if(!hasPerson){toast('Finance Posting writes to a system, so a person brick must come before it.');return false} }
  list.splice(i,0,b); return true;
}

  const idxFP=w.bricks.findIndex(b=>b.label==='Finance Posting');
  if(/council/.test(t)){ const b=newBrickFromPal('council','Procurement council'); b.does='is this supplier safe to pay?'; const at=idxFP>=0?idxFP:w.bricks.length-1; placeBrick(w,b,'root',at); reply='Added a council brick before Finance Posting. The council only advises; Fatima’s decision still stands. Want the council’s view sent to her as well?' }
  else if(/reject|stop/.test(t)){ const ifb=w.bricks.find(b=>b.type==='if'); const b=newBrickFromPal('stop'); if(ifb){placeBrick(w,b,ifb.id,ifb.slot.length)}else{placeBrick(w,b,'root',w.bricks.length-1)} reply='Added a Stop after Fatima’s decision for the rejected case. The supplier isn’t contacted unless you add that step.' }
  else if(/email|remind|supplier/.test(t)){ const b=newBrickFromPal('agent','Contract Review'); b.does='emails the supplier'; placeBrick(w,b,'root',idxFP>=0?idxFP:w.bricks.length-1); reply='Added Contract Review to email the supplier. Sending email is an action, so it will ask Fatima before it sends.' }
  else if(/wait|day/.test(t)){ const m=t.match(/(\d+)\s*(day|hour|week)/); const b=newBrickFromPal('wait'); if(m)b.label=m[1]+' '+m[2]+(m[1]==='1'?'':'s'); placeBrick(w,b,'root',Math.max(1,idxFP)); reply='Added a wait of '+b.label+'. If nothing happens by then, the workflow tells you.' }
  else if(/schedule|every|monday|month/.test(t)){ const b=newBrickFromPal('trigger','On a schedule'); b.label=t.includes('month')?'the 1st of every month, 08:00':'every Monday, 09:00'; placeBrick(w,b,'root',0); reply='Changed the start to a schedule: '+b.label+'.' ; w.trigger=b.label}
  else if(/tell me|notify/.test(t)){ const b=newBrickFromPal('person','Tell me'); placeBrick(w,b,'root',w.bricks.length); reply='Added a Tell me brick at the end.' }
  else { reply='I can add agents, councils, people, waits, stops and if/otherwise shapes. Try “before Finance Posting, ask the Procurement council” or “if Fatima rejects, stop”.' ; w.draft=w.draft}
  logChange(w,reply,false);
}
function runs(w){
  if(!w.runs.length) return `<div class="pane"><div class="in"><div class="status">No runs yet. ${w.status==='draft'?'Send the workflow for approval first.':'Waiting for approval.'}</div></div></div>`;
  return `<div class="pane"><div class="in"><div class="stat"><div><small>This week</small><b>47</b> <span class="note">runs</span></div><div><small>Went straight through</small><b>41</b></div><div><small>Needed a person</small><b>6</b></div><div><small>Waiting now</small><b style="color:var(--warn-ink)">1</b></div></div>
  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="acts">${['All','Waiting','Rejected','Failed'].map((f,i)=>`<button class="btn chip ${(S.rf||'All')===f?'on':''}" data-a="rf" data-f="${f}">${f}</button>`).join('')}</div><button class="btn s" data-a="toast" data-t="Export ready: all runs this quarter, signed, as a PDF and CSV.">Export for audit</button></div>
  <div class="tbl2"><div class="g"><div class="r h"><span>Run</span><span>Invoice</span><span>Outcome</span><span>Decided by</span><span>When</span><span>Took</span></div>
  ${w.runs.filter(r=>{const f=S.rf||'All';return f==='All'||(f==='Waiting'&&r.d==='wait')||(f==='Rejected'&&/Rejected/.test(r.out))||(f==='Failed'&&/Failed/.test(r.out))}).map(r=>`<button class="r" data-a="wfrun" data-id="${w.id}" data-n="${r.n}"><span style="font-weight:600">#${r.n}</span><span>${r.inv}</span><span><span class="pill ${r.d}" style="padding-left:0;background:none"><i></i>${r.out}</span></span><span class="${/—|No person|Told/.test(r.by)?'note':''}">${r.by}</span><span>${r.when}</span><span class="${r.took==='—'?'note':''}">${r.took}</span></button>`).join('')}</div></div>
  <div class="note">Every run opens as a signed log. An auditor can open the same log and replay each step.</div></div></div>`;
}
function runLog(w){
  const r=w.runs.find(x=>x.n===S.run)||w.runs[1];
  const waiting=r.d==='wait';
  return `<div class="thread"><div class="in"><div class="crumb"><button data-a="wtab" data-t="runs">All runs</button><span class="note">/</span><b>Run #${r.n}</b><span class="note">· ${r.when} · ${r.inv} · ${r.took}</span><span style="margin-left:auto" class="acts"><button class="btn s" data-a="toast" data-t="Replaying with the same invoice as a new run.">Replay with the same invoice</button><button class="btn s" data-a="toast" data-t="Signed export of run #${r.n} is ready.">Export for audit</button></span></div>
  <div class="status">Started · ${r.when} · triggered by a new invoice in the Finance system</div>
  ${msg({who:'ic',t:r.when,text:waiting?'Checked '+r.inv.split(' · ')[0]+' against PO-10911. It matches, but the amount is over AED 50,000 so it goes to <b>Fatima Al Mansoori</b> to decide.':'Checked INV-2291 against PO-10877. Two things don’t match.',html:waiting?'':`<div class="tbl"><div class="r h"><span>Item</span><span>Invoice</span><span>Purchase order</span></div><div class="r"><span>Amount</span><span style="color:var(--bad-ink);font-weight:600">AED 84,200</span><span>AED 81,500</span></div><div class="r"><span>Quantity</span><span style="color:var(--bad-ink);font-weight:600">120 units</span><span>115 units</span></div><div class="r"><span>Supplier</span><span>Al Noor Supplies</span><span>Al Noor Supplies</span></div></div><div class="bub">Amount is over AED 50,000, so this goes to <b>Fatima Al Mansoori</b> to decide.</div>`})}
  ${msg({who:'e',t:r.when,html:`<div class="appr"><div style="display:flex;align-items:center;gap:8px;font-weight:700">${ico.shield}Your decision is needed, Fatima</div><div>Approve payment of ${r.inv.split(' · ')[0]} for ${r.inv.split(' · ')[2]}?${waiting?'':' The invoice is AED 2,700 and 5 units above the purchase order.'}</div>${waiting?`<div class="acts"><button class="btn ok s" data-a="decide" data-n="${r.n}" data-d="ok">Approve</button><button class="btn s" data-a="decide" data-n="${r.n}" data-d="no">Reject</button><button class="btn s" data-a="toast" data-t="Your question goes to the builder (Mariam) in this log.">Ask a question</button></div><div class="note" style="color:inherit">Waiting since ${r.when}. You’re seeing Fatima’s buttons because this prototype lets you act as her.</div>`:`<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok-ink);border-top:1px solid var(--person-av);padding-top:8px">${ico.check}<span><b>${/Rejected/.test(r.out)?'Rejected':'Approved'} by Fatima Al Mansoori</b> · ${/Rejected/.test(r.out)?'“Contract has expired. Hold until renewed.”':'09:40 · “Extra units were agreed by email with the supplier on 14 Oct.”'}</span></div>`}</div>`})}
  ${waiting||/Rejected/.test(r.out)?'':msg({who:'fp',t:'09:41',text:'Posted INV-2291 to the Finance system as approved. Reference <b>FP-77102</b>.'})}
  <div class="status">${waiting?ico.clock+' Waiting for a person · nothing is written until she decides':ico.check+' Finished · '+r.took+' · 2 agents, 1 person · every entry above is signed and timed'}</div>
  <div class="note" style="border-top:1px solid var(--line);padding-top:10px">This is a record, not a chat. To change what the workflow does, go to Build. To ask the agents something, open a council.</div></div></div>`;
}
function versions(w){
  const draft=w.draft?`<div class="f">${av('mk','MK','sm')}<div><b>Version ${w.version+1} · draft</b> <span class="pill wait"><i></i>Not sent yet</span><div class="note">${(w.log||[]).filter(m=>m.me).map(m=>esc(m.text)).join(' · ')||'Edited in Build'}</div></div></div>`:'';
  return `<div class="pane"><div class="in"><div class="feed">${draft}${w.versions.map(v=>`<div class="f">${av(/Fatima/.test(v.who)?'fa':'mk',/Fatima/.test(v.who)?'FA':'MK','sm')}<div><b>Version ${v.v}</b> · ${v.who} · ${v.when}<div class="note">${esc(v.what)}</div></div></div>`).join('')||'<div class="f note">No versions yet.</div>'}</div><div class="note">A new version only replaces the live one once it is approved. The live one keeps running meanwhile.</div></div></div>`;
}

/* ---- Activity ---- */
function activityMain(){
  const dyn=[]; if(S.newAgent&&S.newAgent.awaiting) dyn.push({who:'fa',text:'Fatima Al Mansoori asked a question on '+S.newAgent.name,when:now()});
  return `<main class="main"><div class="top"><div class="who"><div><div class="ttl">Activity</div><div class="sub">Things that need you, and what your agents and workflows did</div></div></div><button class="btn s" data-a="readall">Mark all read</button></div>
  <div class="pane"><div class="in"><div class="feed">${dyn.concat(ACTIVITY).map(a=>`<div class="f">${a.who==='wf'?`<div class="av tile sm" aria-hidden="true" style="width:32px;height:32px">${ico.wf}</div>`:av(a.who,{fa:'FA',cr:'CR',ic:'IC'}[a.who],'sm')}<div><div>${esc(a.text)}</div><div class="note">${a.when}</div></div></div>`).join('')}</div></div></div></main>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a; e.preventDefault();
  if(a==='view'){S.view=el.dataset.v;S.adv=null;if(S.view==='activity'){S.unread=0}render();return}
  if(a==='chat'){S.chat=el.dataset.id;S.adv=null;render();return}
  if(a==='newagent'){S.chat='new';S.adv=null;if(S.newStage!=='start'&&S.newAgent&&S.newAgent.status!=='draft'){ if(S.newAgent.status==='live'){AGENTS['n'+Date.now()]=Object.assign({},S.newAgent,{id:'ic2',ini:'IC',thread:S.newThread,when:now()})} S.newStage='start';S.newThread=[];S.newAgent=null} render();return}
  if(a==='tpl'){startNewAgent(el.dataset.t);return}
  if(a==='approve'){sendForApproval();return}
  if(a==='try'){tryIt();return}
  if(a==='askit'){askIT(el.dataset.q);return}
  if(a==='sentit'){S.newThread.push({who:'status',icon:ico.send,text:'Request REQ-4471 sent to IT · '+now()+' · IT usually answers within 2 working days · you’ll hear back in this chat'});render();return}
  if(a==='adv'){S.adv=el.dataset.id;render();return}
  if(a==='advclose'){S.adv=null;render();return}
  if(a==='advdone'){advDone();return}
  if(a==='advsay'){const v=$('#f-say').value.trim();if(!v){toast('Type what you want to change first.');return} advDone();return}
  if(a==='runs'){const n=S.adv==='new'?S.newAgent:AGENTS[S.adv];n.runs=el.dataset.r;render();return}
  if(a==='gowf'){S.view='workflows';S.wf='inv';S.wtab='build';S.adv=null;render();return}
  if(a==='councilask'){askCouncil(COUNCILS[S.chat],el.dataset.t);return}
  if(a==='wf'){S.wf=el.dataset.id;S.wtab='build';render();return}
  if(a==='wtab'){S.wtab=el.dataset.t;render();return}
  if(a==='wfrun'){S.view='workflows';S.wf=el.dataset.id;S.wtab='run';S.run=+el.dataset.n;render();return}
  if(a==='rf'){S.rf=el.dataset.f;render();return}
  if(a==='del'){const w=WORKFLOWS[S.wf];const b=removeBrick(w,el.dataset.id);if(b){logChange(w,'Removed '+(b.label||b.type)+'.',false);w.log[w.log.length-1].text='You removed '+(b.label||b.type);w.log[w.log.length-1].me=true}render();return}
  if(a==='wfsend'){const w=WORKFLOWS[S.wf];clearFresh(w);if(!w.draft&&w.status!=='draft'){toast('Nothing changed since version '+w.version+'.');return} w.versions.unshift({v:w.version+1,who:'Sent to Fatima Al Mansoori',when:now(),what:(w.log||[]).filter(m=>m.me).map(m=>m.text).join('; ')||'Edited in Build'});w.draft=false;w.status=w.status==='draft'?'wait':w.status;w.log=[];toast('Version '+(w.version+1)+' sent to Fatima. Version '+w.version+' keeps running.');w.version++;S.unread++;return}
  if(a==='decide'){const w=WORKFLOWS[S.wf];const r=w.runs.find(x=>x.n===+el.dataset.n);if(el.dataset.d==='ok'){r.out='Approved, posted';r.d='live';r.by='Fatima Al Mansoori';r.took='just now'}else{r.out='Rejected';r.d='paused';r.by='Fatima Al Mansoori';r.took='just now'}render();return}
  if(a==='readall'){S.unread=0;render();return}
  if(a==='mic'){toast('Listening… (in the real product this records Arabic or English)');return}
  if(a==='toast'){toast(el.dataset.t);return}
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const k=e.target.dataset.kind; const inp=e.target.querySelector('input'); const v=(inp.value||'').trim();
  if(k==='first'){ startNewAgent(v||'I want an agent that checks supplier invoices against purchase orders in the Finance system and flags anything that doesn\'t match.'); return }
  if(!v) return;
  if(k==='new'){ if(S.newAgent&&S.newAgent.awaiting==='fa') replyApprover(v); else replyNew(v); return }
  if(k==='council'){ askCouncil(COUNCILS[S.chat],v); return }
  if(k==='agent'){ const a=AGENTS[S.chat]; a.thread.push({who:'you',text:v,t:now()}); S.typing=true; render(); setTimeout(()=>{S.typing=false; if(a.status==='wait'&&a.id==='lr'){a.thread.push({who:'status',text:'Your answer went to Fatima · '+now()})} else if(/change|add|instead|also/i.test(v)){a.thread.push({who:'e',t:now(),text:'Noted. Changing a live agent makes a new version that '+a.approver+' approves before it replaces this one. I’ve drafted it.',html:`<div class="acts"><button class="btn s" data-a="adv" data-id="${a.id}">See the draft</button></div>`})} else {a.thread.push({who:a.id,t:now(),text:'Here’s what I have on that from the '+a.uses[0].split(' (')[0]+'. Open the Details view for how I decide, or ask me for a specific invoice.'})} render()},1000); return }
  if(k==='say'){ const w=WORKFLOWS[S.wf]; sayIt(w,v); render(); return }
});
document.addEventListener('input',e=>{const c=e.target.closest('[data-chip]');if(!c)return;const w=WORKFLOWS[S.wf];const f=l=>{for(const b of l){if(b.id===c.dataset.chip){b[c.dataset.k]=c.textContent;w.draft=true;return true}if(b.slot&&f(b.slot))return true}};f(w.bricks)});
/* drag and drop */
document.addEventListener('dragstart',e=>{
  const p=e.target.closest('[data-pal]'); const m=e.target.closest('[data-move]');
  if(p){S.dragging={pal:p.dataset.pal,label:p.dataset.label}} else if(m){S.dragging={move:m.dataset.move}} else return;
  e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain','brick')}catch(_){}
  setTimeout(()=>{document.querySelectorAll('.drop').forEach(d=>{d.classList.add('live');d.textContent='Drop here'})},0);
});
document.addEventListener('dragend',()=>{S.dragging=null;document.querySelectorAll('.drop').forEach(d=>{d.classList.remove('live','over');d.textContent=''})});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d&&S.dragging){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{
  const d=e.target.closest('[data-drop]'); if(!d||!S.dragging) return; e.preventDefault();
  const w=WORKFLOWS[S.wf]; const path=d.dataset.drop; let i=+d.dataset.i; let b;
  if(S.dragging.move){ if(path===S.dragging.move){S.dragging=null;render();return} b=removeBrick(w,S.dragging.move); if(path==='root'){const idx=w.bricks.findIndex(x=>x.id===S.dragging.move);} if(!b){S.dragging=null;render();return} delete b.fresh }
  else b=newBrickFromPal(S.dragging.pal,S.dragging.label);
  const ok=placeBrick(w,b,path,i); if(ok){ logChange(w,'You '+(S.dragging.move?'moved':'added')+' '+(b.label||b.type)+(path==='root'?'':' inside the If'),true); }
  else if(S.dragging.move){ w.bricks.push(b) }
  S.dragging=null; render();
});
render();
</script>
